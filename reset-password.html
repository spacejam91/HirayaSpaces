<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Hiraya Spaces</title>
<meta property="og:image" content="https://hirayaspaces.ca/preview-image.jpg">
<meta name="twitter:image" content="https://hirayaspaces.ca/preview-image.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --forest-soft: #2d5a3d;
    --mist-warm: #eaf2ec;
    --sage: #1e4d2b;
    --sage-light: #e4f0e9;
    --sage-mid: #5a9470;
    --cream: #f8faf8;
    --warm: #f0f5f1;
    --text: #1a2e1e;
    --muted: #566853;
    --border: #d4e2d8;
  }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--text); }
  .modal-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 400; margin-bottom: 0.5rem; }
  .modal-sub { font-size: 13px; color: var(--muted); margin-bottom: 2rem; font-weight: 300; line-height: 1.6; }
  .modal-field { margin-bottom: 1rem; }
  .modal-field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px; }
  .modal-field input {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 12px;
    font-size: 14px; font-family: 'Jost', sans-serif; color: var(--text); outline: none;
    transition: border-color .2s; background: white;
  }
  .modal-field input:focus { border-color: var(--sage); }
  .modal-err { color: var(--forest-soft); font-size: 12px; margin-bottom: 0.75rem; display: none; }
  .modal-btn {
    width: 100%; background: var(--sage); color: white; border: none;
    padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: 'Jost', sans-serif; margin-top: 0.5rem;
    transition: background .2s;
  }
  .modal-btn:hover { background: #2d6644; }
</style>
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<main class="reset-page">
  <div class="reset-card" id="reset-password-form">
    <div class="modal-logo">HIRAYA SPACES</div>
    <h1 class="modal-title">Set a new password</h1>
    <p class="modal-sub">Choose a new password for your account. You'll be logged in automatically.</p>

    <form onsubmit="event.preventDefault(); HirayaAuth.doResetPassword();">
      <div class="modal-field">
        <label for="rp-pass">New password</label>
        <input type="password" id="rp-pass" name="password" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="At least 8 characters">
      </div>
      <div class="modal-field">
        <label for="rp-pass2">Confirm new password</label>
        <input type="password" id="rp-pass2" name="password-confirm" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Re-enter password">
      </div>
      <div class="modal-err" id="rp-err" role="alert"></div>
      <button type="submit" class="modal-btn" id="rp-submit">Update password</button>
    </form>
    <a class="reset-back" href="/">← Back to site</a>
  </div>
</main>

<!-- Supabase + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
